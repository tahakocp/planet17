name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  OPENSCAD_URL: https://files.openscad.org/snapshots/OpenSCAD-2026.11.20-x86_64.AppImage

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install OpenSCAD
        run: |
          curl -fsSL -o openscad.AppImage "$OPENSCAD_URL"
          chmod +x openscad.AppImage
          ./openscad.AppImage --appimage-extract > /dev/null
          echo "OPENSCAD=$PWD/squashfs-root/AppRun" >> "$GITHUB_ENV"
          ./squashfs-root/AppRun --version
      - name: Mesh and clash checks
        run: scripts/check.sh
      - name: Committed STLs match the source
        run: |
          scripts/build.sh
          git diff --stat --exit-code stl || { echo "stl/ is stale, run scripts/build.sh"; exit 1; }
      - name: Render previews
        run: |
          xvfb-run -a "$OPENSCAD" --backend=manifold -D 'part="assembly"' -o /tmp/assembly.png \
            --imgsize 800,600 --camera 0,0,18,62,0,25,200 scad/planet17.scad
          test -s /tmp/assembly.png
